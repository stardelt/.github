name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, manifests, or clicks. Trim secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or image digest, and where it runs (kind, k3s, other).
